<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landerlan - Verificação</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-gold: #a68c42; 
            --light-gold: #d4c8a2;   
            --text-gold: #b3a372;    
            --bg-secondary: #fdfaf3; 
            --border-gold: #caba93;  
            --footer-bg: #444444;    
            --footer-text: #cccccc;  
            --bg-color: #ffffff;
            --modal-bg: #f5f3ed;
            --success-green: #5eb85c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Cabeçalho --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #fdfdfd;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo { width: 50px; height: 50px; }

        /* --- Conteúdo Principal --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            margin-top: -50px;
        }

        .qr-icon {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }

        .description {
            color: var(--text-gold);
            font-size: 16px;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 40px;
        }

        /* --- Botões --- */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 250px;
        }

        .btn {
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-decoration: none; 
            text-align: center;
            display: block;
        }

        .btn-primary {
            background-color: var(--primary-gold);
            color: white;
            border: none;
        }

        .btn-primary:active { background-color: #8c7536; }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--primary-gold);
            border: 1px solid var(--border-gold);
        }

        .btn-secondary:active { background-color: #f0eadd; }

        /* --- Rodapé --- */
        footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 12px 10px;
            font-size: 14px;
        }

        /* --- Modais e Overlays --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .hidden { display: none !important; }

        /* Modal de Sucesso */
        .modal {
            background-color: var(--modal-bg);
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .success-text {
            color: var(--success-green);
            font-size: 18px;
            font-weight: bold;
        }

        .modal-body p {
            color: #333;
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.4;
            font-weight: 500;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn-ok {
            background-color: var(--success-green);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: opacity 0.2s;
        }
        
        .btn-ok:active {
            opacity: 0.8;
        }

        /* Container da Câmera */
        .camera-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        
        #reader { width: 100%; }
        
    </style>
</head>
<body>

    <header>
        <div class="menu-icon">
            <svg width="24" height="20" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="2" fill="#a68c42"/>
                <rect y="9" width="24" height="2" fill="#a68c42"/>
                <rect y="18" width="24" height="2" fill="#a68c42"/>
            </svg>
        </div>
        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" stroke="#a68c42" stroke-width="4"/>
                <text x="50" y="70" font-family="Georgia, serif" font-size="55" font-style="italic" fill="#a68c42" text-anchor="middle">L</text>
            </svg>
        </div>
    </header>

    <main>
        <div class="qr-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 5 30 L 5 5 L 30 5" stroke="#d4c8a2" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
                <rect x="13" y="13" width="12" height="12" stroke="#d4c8a2" stroke-width="6"/>
                <path d="M 70 5 L 95 5 L 95 30" stroke="#d4c8a2" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
                <rect x="75" y="13" width="12" height="12" stroke="#d4c8a2" stroke-width="6"/>
                <path d="M 5 70 L 5 95 L 30 95" stroke="#d4c8a2" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
                <rect x="13" y="75" width="12" height="12" stroke="#d4c8a2" stroke-width="6"/>
                <path d="M 78 95 L 95 95 L 95 70" stroke="#d4c8a2" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
                <rect x="42" y="42" width="10" height="10" fill="#d4c8a2"/>
                <rect x="58" y="42" width="10" height="10" fill="#d4c8a2"/>
                <rect x="68" y="55" width="20" height="6" fill="#d4c8a2"/>
                <rect x="55" y="55" width="8" height="8" fill="#d4c8a2"/>
                <rect x="42" y="58" width="8" height="20" fill="#d4c8a2"/>
                <rect x="55" y="70" width="10" height="8" fill="#d4c8a2"/>
                <rect x="68" y="75" width="6" height="6" fill="#d4c8a2"/>
            </svg>
        </div>

        <p class="description">
            Escaneando o QR visível na etiqueta do seu produto. Verifique a autenticidade do mesmo
        </p>

        <div class="button-group">
            <button id="btn-scan" class="btn btn-primary">Escanear QR</button>
            <a href="https://www.landerlan.com.py/index.php" class="btn btn-secondary">Ver produtos</a>
        </div>
    </main>

    <footer>landerlan.com.py</footer>

    <div id="camera-overlay" class="overlay hidden">
        <div class="camera-container">
            <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Aponte para o QR Code</h3>
            <div id="reader"></div>
            <button id="btn-cancel-scan" class="btn btn-secondary" style="margin-top: 15px; width: 100%;">Cancelar</button>
        </div>
    </div>

    <div id="success-modal" class="overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="20" fill="#5eb85c"/>
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="success-text">Produto Válido</span>
            </div>
            <div class="modal-body">
                <p style="font-weight: normal;">Produto: TREMBOLONA ACETATO 100 mg/mL LANDERLAN<br>FCO X 10 ML</p>
                <p style="margin-top: 10px; font-weight: normal;">Validado: 1 vez.</p>
            </div>
            <div class="modal-footer">
                <button id="btn-ok" class="btn-ok">Ok</button>
            </div>
        </div>
    </div>

    <script>
        const btnScan = document.getElementById('btn-scan');
        const btnCancelScan = document.getElementById('btn-cancel-scan');
        const btnOk = document.getElementById('btn-ok');
        
        const cameraOverlay = document.getElementById('camera-overlay');
        const successModal = document.getElementById('success-modal');
        
        let html5QrCode;

        btnScan.addEventListener('click', () => {
            cameraOverlay.classList.remove('hidden'); 
            
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                
                (decodedText, decodedResult) => {
                    html5QrCode.stop().then(() => {
                        cameraOverlay.classList.add('hidden'); 
                        successModal.classList.remove('hidden'); 
                    }).catch(err => console.error(err));
                },
                
                (errorMessage) => { }
            ).catch(err => {
                alert("Erro ao acessar a câmera. Certifique-se de dar permissão ou usar um servidor local/https.");
                cameraOverlay.classList.add('hidden');
            });
        });

        btnCancelScan.addEventListener('click', () => {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    cameraOverlay.classList.add('hidden');
                }).catch(err => console.error(err));
            } else {
                cameraOverlay.classList.add('hidden');
            }
        });

        btnOk.addEventListener('click', () => {
            successModal.classList.add('hidden'); 
        });
    </script>
</body>
</html>
